name: Semantic Release
run-name: Releasing on ${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - [ $default-branch ]
  workflow_dispatch:
    inputs:
      preRelease:
        description: 'Pre-Release'
        required: false
        default: false
        type: boolean
      bump-maj-ver-tag:
        description: 'Create or update a major version tag'
        required: false
        default: true
        type: boolean
      dry-run:
        description: 'Dry Run'
        required: false
        default: false
        type: boolean

jobs:
  exe-npm-sem-rel-action:
    name: Execute Semantic Release Workflow
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
        persist-credentials: false
        fetch-depth: 0

    - name: Semantic Release
      uses: croesusfin/npm-semantic-release-action@v1
      with:
        semantic-release-access-token: ${{ secrets.SEMANTIC_RELEASE_ACCESS_TOKEN }}
        write-croesusfin-token: ${{ secrets.WRITE_CROESUSFIN_TOKEN }}
        target-sha-to-use-for-update: ${{ github.sha }}
        target-ref-to-use-for-update: ${{ github.ref }}
        preRelease: ${{ inputs.preRelease || false }}
        target-config-file: ${{ hashFiles(./release.config.js) && './release.config.js' || '' }}
        bump-major-version-tag: ${{ inputs.bump-maj-ver-tag || false }}
        dry-run: ${{ inputs.dry-run || false }}
